name: Daily portfolio snapshot
on:
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python update_snapshots.py
      - name: Commit database
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add portfolio.db
          git diff --cached --quiet || git commit -m "Daily portfolio snapshot"
          git push
